<!DOCTYPE html>

    <title>Library System - Books</title>
    <style>
        #book-gallery-container {
            padding: 40px 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        #search-container {
            text-align: center;
            margin-bottom: 30px;
        }
        #book-search {
            width: 80%;
            max-width: 500px;
            padding: 10px 15px;
            border: 2px solid #ccc;
            border-radius: 20px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }
        #book-search:focus {
            border-color: #e8491d;
        }
        .book-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 25px;
            justify-items: center;
        }
        .book-item {
            cursor: pointer;
            overflow: hidden;
            border-radius: 8px;
            transition: transform 0.2s, box-shadow 0.2s;
            text-align: center;
            max-width: 100%;
        }
        .book-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }
        .book-item img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid #ddd;
        }
        .book-item p {
            font-size: 14px;
            font-weight: bold;
            color: #333;
            margin-top: 10px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding: 0 5px;
        }
        .modal {
            display: none;
            position: fixed; 
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%; 
            height: 100%; 
            overflow: auto; 
            background-color: rgba(0,0,0,0.7);
            padding-top: 50px;
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background-color: #fefefe;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
            width: 90%; 
            max-width: 600px;
            position: relative;
            box-shadow: 0 4px 8px 0 rgba(0,0,0,0.2), 0 6px 20px 0 rgba(0,0,0,0.19);
            display: flex;
            flex-direction: column;
            align-items: center;
            max-height: 90vh; 
            overflow-y: auto; 
        }
        .modal-content h2 {
            color: #e8491d;
            margin-top: 0;
            margin-bottom: 20px;
        }
        .details-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 10px;
            width: 100%;
            max-width: 400px;
            text-align: left;
            margin-bottom: 20px;
        }
        .details-grid strong {
            color: #505050;
        }
        #modal-image {
            max-width: 100%;
            max-height: 300px;
            margin: 20px 0;
            border-radius: 5px;
            object-fit: cover;
            border: 1px solid #ddd;
        }
        .close-button {
            color: #aaa;
            position: absolute;
            top: 10px;
            right: 20px;
            font-size: 30px;
            font-weight: bold;
        }
        .close-button:hover,
        .close-button:focus {
            color: #e8491d;
            text-decoration: none;
            cursor: pointer;
        }
        .borrow-btn {
            background-color: #e8491d;
            color: white;
            border: none;
            padding: 12px 25px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .borrow-btn:hover {
            background-color: #c43c16;
        }
        #no-books-message {
            display: none;
            padding: 15px;
            margin-top: 20px;
            border: 1px solid #ffcc00;
            background-color: #fff9e6;
            color: #856404;
            border-radius: 5px;
            text-align: center;
            width: 80%;
            max-width: 500px;
            margin: 20px auto;
            font-weight: 500;
        }
        @media(max-width: 768px){
            header #branding,
            header nav,
            header nav li {
                float: none;
                text-align: center;
                width: 100%;
                grid-template-columns: 1fr;
            }
            header nav ul {
                display: grid;
                gap: 10px;
                grid-template-columns: 1fr 1fr;
            }
            .overview {
                flex-direction: column;
                align-items: center;
                width: 100%;
            }
            .overview-card {
                width: 80%;
            }
         }  
        
    </style>

        const bookGrid = document.getElementById('book-grid');
         const modal = document.getElementById('book-details-modal');
          const closeButton = document.querySelector('.close-button');
           const searchInput = document.getElementById('book-search');
            const noBooksMessage = document.getElementById('no-books-message');
             const currentBookData = document.getElementById('current-book-data');
              const borrowButton = document.getElementById('borrow-button');
               const loggedInUser = localStorage.getItem('firstName');

        function loadBorrowingTransactions() {
            const transactions = localStorage.getItem('borrowingTransactions');
            return transactions ? JSON.parse(transactions) : [];
        }

        function createBookItem(book) {
            const bookItem = document.createElement('div');
             bookItem.className = 'book-item';
              bookItem.dataset.id = book.id;
               bookItem.innerHTML = `
                <img src="${book.imageUrl}" alt="${book.title} Cover" />
                <p>${book.title}</p>
            `;
            bookItem.addEventListener('click', () => showBookDetails(book));
            return bookItem;
        }

        function renderBooks(filteredBooks) {
            bookGrid.innerHTML = '';
            if (filteredBooks.length === 0) {
                noBooksMessage.style.display = 'block';
                noBooksMessage.innerHTML = '<strong>No books found.</strong> Try a different search term or check back later.';
            } else {
                noBooksMessage.style.display = 'none';
                filteredBooks.forEach(book => {
                    bookGrid.appendChild(createBookItem(book));
                });
            }
        }

        function showBookDetails(book) {
            document.getElementById('modal-image').src = book.imageUrl;
            document.getElementById('modal-title').textContent = book.title;
            document.getElementById('modal-language').textContent = book.language;
            document.getElementById('modal-author').textContent = book.author;
            document.getElementById('modal-genre').textContent = book.genre;
            document.getElementById('modal-release-date').textContent = book.releaseDate;
        
            document.getElementById('modal-price').textContent = '';
            document.getElementById('modal-summary').textContent = book.summary;
            currentBookData.dataset.id = book.id;
            currentBookData.dataset.title = book.title;
            modal.style.display = 'flex';
            
            borrowButton.textContent = 'Remove';
            borrowButton.onclick = function() {
                removeBookById(book.id);
                closeModal();
            };
        }

        function closeModal() {
            modal.style.display = 'none';
        }

        function removeBookById(bookId) {
            const idx = booksData.findIndex(b => b.id === bookId);
            if (idx !== -1) {
                booksData.splice(idx, 1);
                renderBooks(booksData);
                alert('Book removed.');
            }
        }

        closeButton.addEventListener('click', closeModal);

        window.addEventListener('click', (event) => {
            if (event.target === modal) {
                closeModal();
            }
        });

        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape' && modal.style.display === 'flex') {
                closeModal();
            }
        });
        
        searchInput.addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
              const filteredBooks = booksData.filter(book => 
                  book.title.toLowerCase().includes(searchTerm) ||
                    book.author.toLowerCase().includes(searchTerm) ||
                      book.genre.toLowerCase().includes(searchTerm)
            );
            renderBooks(filteredBooks);
        });

        document.addEventListener('DOMContentLoaded', () => {
            renderBooks(booksData);
        });
