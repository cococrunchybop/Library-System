    <style>
        #book-gallery-container {
            padding: 40px 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .book-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 25px;
            justify-items: center;
        }

        .book-item {
            cursor: pointer;
            overflow: hidden;
            border-radius: 8px;
            transition: transform 0.2s, box-shadow 0.2s;
            text-align: center;
            max-width: 180px;
        }

        .book-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .book-item img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid #ddd;
        }

        .book-item p {
            font-size: 14px;
            font-weight: bold;
            color: #333;
            margin-top: 10px;
        }

        .modal {
            display: none;
            position: fixed; 
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%; 
            height: 100%; 
            overflow: auto; 
            background-color: rgba(0,0,0,0.7);
            padding-top: 50px;
        }

        
        .modal-content {
            background-color: #fefefe;
            margin: 5% auto;
            padding: 30px;
            border-radius: 10px;
            width: 90%; 
            max-width: 600px;
            position: relative;
            box-shadow: 0 4px 8px 0 rgba(0,0,0,0.2), 0 6px 20px 0 rgba(0,0,0,0.19);
            display: flex;
            flex-direction: column;
            align-items: center;
            max-height: 90vh; 
            overflow-y: auto; 
        }

        .modal-content h2 {
            color: #e8491d;
            margin-top: 0;
            margin-bottom: 20px;
        }

        .details-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 10px;
            width: 100%;
            max-width: 400px;
            text-align: left;
            margin-bottom: 20px;
        }

        .details-grid strong {
            color: #505050;
        }

        #modal-image {
            max-width: 100%;
            max-height: 300px;
            margin: 20px 0;
            border-radius: 5px;
            object-fit: cover;
            border: 1px solid #ddd;
        }

        .close-button {
            color: #aaa;
            position: absolute;
            top: 10px;
            right: 20px;
            font-size: 30px;
            font-weight: bold;
        }

        .close-button:hover,
        .close-button:focus {
            color: #e8491d;
            text-decoration: none;
            cursor: pointer;
        }

        .borrow-btn {
            background-color: #e8491d;
            color: white;
            border: none;
            padding: 12px 25px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .borrow-btn:hover {
            background-color: #c43c16;
        }
        .book-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 25px;
            justify-items: center;
        }
        @media(max-width: 768px){
            header #branding,
            header nav,
            header nav li {
                float: none;
                text-align: center;
                width: 100%;
                grid-template-columns: 1fr;
            }
            header nav ul {
                display: grid;
                gap: 10px;
                grid-template-columns: 1fr 1fr;
            }
            .book-grid {
                grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));

            }

        function closeModal() {

        function openModal(book) {

            currentBookData.setAttribute('data-id', book.id);
            modal.style.display = 'flex';
        }

        function renderBooks() {
            booksData.forEach(book => {

                  item.className = 'book-item';
                
                const img = document.createElement('img');
                 img.src = book.imageUrl; 
                  img.alt = book.title + ' Cover';

                const title = document.createElement('p');
                title.textContent = book.title;

                item.appendChild(img);
                  item.appendChild(title);
  
                item.addEventListener('click', () => {
                    openModal(book);
                  });

                bookGrid.appendChild(item);
            });
        }
